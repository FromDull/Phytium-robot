# JC4010 gimbal persistent runtime configuration.
# Angles are calibrated software safety limits relative to the saved zero.
yaw_min_deg=-90
yaw_max_deg=90
pitch_min_deg=-51
pitch_max_deg=101.0

# Startup motion to yaw=0, pitch=0.
home_speed_rpm=10
home_torque_percent=80

# Normal shutdown: keep current yaw and return pitch to its enable-time angle.
return_speed_rpm=5
return_torque_percent=80

# Defaults used by set/center/sweep/test when arguments are omitted.
move_speed_rpm=20
move_torque_percent=80
