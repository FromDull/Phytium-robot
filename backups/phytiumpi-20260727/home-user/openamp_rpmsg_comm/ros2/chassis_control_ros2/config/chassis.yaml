openamp_chassis:
  ros__parameters:
    broker_socket: /run/rpmsg-broker/rpmsg.sock
    command_rate_hz: 20.0
    command_timeout_ms: 300
    cmd_vel_timeout_s: 0.25
    max_linear_m_s: 0.20
    max_angular_rad_s: 0.50
    # Measure wheel-ground contact center distance before enabling angular.z.
    wheel_track_m: 0.36
    odom_frame: odom
    base_frame: base_link
    # Keep false when lidar odometry or another localization node owns odom TF.
    publish_tf: false
