slam_toolbox:
  ros__parameters:
    # Official slam_toolbox Ceres baseline, pinned for reproducible ARM builds.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    # RPLIDAR publishes 0.15-18.0 m, while slam_toolbox reports 0.2 m as
    # the reliable minimum capability. Discard near-field invalid returns.
    min_laser_range: 0.2
    max_laser_range: 18.0

    # Preserve the measured 10 Hz odometry / processing cadence and detailed map.
    resolution: 0.025
    minimum_time_interval: 0.10
    minimum_travel_distance: 0.025
    minimum_travel_heading: 0.05
    transform_publish_period: 0.05
    map_update_interval: 1.0

    # Keep latency bounded when the 22 Hz scanner outruns the 10 Hz SLAM loop.
    scan_queue_size: 1
    throttle_scans: 1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    transform_timeout: 0.20
    tf_buffer_duration: 10.0

    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    enable_interactive_mode: false
    use_map_saver: true
    debug_logging: false
