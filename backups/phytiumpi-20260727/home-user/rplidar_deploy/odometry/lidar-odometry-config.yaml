lidar_odometry:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    status_topic: /lidar_odometry/status
    odom_frame: odom
    base_frame: base_link
    laser_frame: laser
    laser_x: -0.0375
    laser_y: 0.0
    laser_z: -0.0858
    laser_roll: 3.141592653589793
    laser_pitch: 0.0
    laser_yaw: 0.7853981633974483
    processing_interval: 0.08
    min_range: 0.20
    max_range: 12.0
    sample_count: 360
    imu_enabled: true
    imu_yaw_fusion_weight: 0.35
    imu_max_age_ms: 300
    imu_tilt_covariance_gain: 3.0
    cell_size: 0.08
    max_correspondence: 0.20
    min_matches: 40
    trim_ratio: 0.75
    max_rms: 0.08
    max_iterations: 6
    translation_deadband: 0.002
    rotation_deadband: 0.003
    max_linear_speed: 0.45
    max_angular_speed: 1.50
    frame_translation_margin: 0.015
    frame_rotation_margin: 0.035
    velocity_filter_alpha: 0.35
    max_reference_interval: 5.00
    static_scan_rms: 0.012
    static_trim_ratio: 0.70
    static_zero_rms: 0.025
    static_reference_refresh: 2.00
